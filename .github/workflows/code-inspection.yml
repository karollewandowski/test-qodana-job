name: Code Inspection
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect-pr:
    name: Inspect code (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Qodana - Code Inspection
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: true
          upload-result: true
          args: |
            --linter qodana-jvm-community
            --within-docker false

  inspect-main:
    name: Inspect code (Full)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Qodana - Code Inspection
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
          upload-result: true
          args: |
            --linter qodana-jvm-community
            --within-docker false
