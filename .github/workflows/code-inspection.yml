name: Code Inspection
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect code
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }} # for the 'main' it will be null and will check the whole codebase
          fetch-depth: 0
      - name: Qodana - Code Inspection
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: true
          upload-result: true
          args: |
            --linter qodana-jvm-community
            --within-docker false
